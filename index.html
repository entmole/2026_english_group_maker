<style>
  /* ===== 리퀴드 글래스 디자인 토큰 ===== */
  :root {
    --ink: #0f172a;
    --ink-soft: #475569;
    --accent: #0f766e;
    --accent-2: #14b8a6;
    --glass-tint: rgba(255, 255, 255, .34);
    --glass-tint-2: rgba(255, 255, 255, .14);
    --glass-edge: rgba(255, 255, 255, .62);
    --glass-shadow: 0 10px 40px rgba(30, 41, 59, .14);
    --blur: 24px;
  }
  html, body { min-height: 100%; }
  body {
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 10% -10%, #c7d2fe 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #fbcfe8 0%, transparent 55%),
      radial-gradient(900px 700px at 50% 120%, #99f6e4 0%, transparent 60%),
      linear-gradient(160deg, #eef2ff 0%, #f0fdfa 50%, #fdf2f8 100%);
    background-attachment: fixed;
  }
  /* 배경에 떠다니는 색 덩어리: 유리 너머로 굴절되어 보이는 효과 */
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blobs span { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
  .blobs span:nth-child(1) { width: 420px; height: 420px; left: -80px; top: 12%; background: #5eead4; }
  .blobs span:nth-child(2) { width: 360px; height: 360px; right: -60px; top: 30%; background: #a5b4fc; animation-duration: 26s; }
  .blobs span:nth-child(3) { width: 320px; height: 320px; left: 35%; bottom: -120px; background: #f9a8d4; animation-duration: 30s; }
  @keyframes drift { to { transform: translate(60px, -40px) scale(1.12); } }

  .glass {
    position: relative;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(135deg, var(--glass-tint), var(--glass-tint-2));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.25);
    border-radius: 24px;
  }
  .glass-strong { --glass-tint: rgba(255,255,255,.62); --glass-tint-2: rgba(255,255,255,.36); }
  .glass-muted  { --glass-tint: rgba(226,232,240,.38); --glass-tint-2: rgba(226,232,240,.18); }
  .glass-card { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .glass-card:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 18px 50px rgba(15,118,110,.18), inset 0 1px 0 rgba(255,255,255,.9); }
  .glass-card.picked { --glass-tint: rgba(204,251,241,.7); --glass-tint-2: rgba(153,246,228,.35); border-color: rgba(20,184,166,.9); box-shadow: 0 0 0 3px rgba(20,184,166,.35), var(--glass-shadow); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    border-radius: 999px; font-weight: 500; transition: transform .15s, background .2s, box-shadow .2s;
    -webkit-backdrop-filter: blur(16px) saturate(170%); backdrop-filter: blur(16px) saturate(170%);
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-glass { background: rgba(255,255,255,.42); border: 1px solid rgba(255,255,255,.7); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 10px rgba(30,41,59,.08); }
  .btn-glass:hover:not(:disabled) { background: rgba(255,255,255,.62); }
  .btn-primary { color: #fff; border: 1px solid rgba(255,255,255,.35);
    background: linear-gradient(180deg, rgba(20,184,166,.92), rgba(15,118,110,.95));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 24px rgba(15,118,110,.32); }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, rgba(20,184,166,1), rgba(17,94,89,1)); }
  .btn-dark { color: #fff; border: 1px solid rgba(255,255,255,.2);
    background: linear-gradient(180deg, rgba(51,65,85,.88), rgba(15,23,42,.92));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 18px rgba(15,23,42,.25); }

  .input-glass {
    background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8); border-radius: 14px;
    box-shadow: inset 0 1px 2px rgba(15,23,42,.06); color: var(--ink);
  }
  .input-glass:focus { outline: none; background: rgba(255,255,255,.8); box-shadow: 0 0 0 3px rgba(20,184,166,.35); }
  .input-glass::placeholder { color: #94a3b8; }

  .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.7); box-shadow: inset 0 1px 3px rgba(15,23,42,.08); }
  .seg button { border-radius: 999px; padding: .5rem 1rem; font-size: .875rem; color: var(--ink-soft); transition: all .2s; }
  .seg button.on { color: var(--ink); font-weight: 600; background: rgba(255,255,255,.85); box-shadow: 0 2px 10px rgba(15,23,42,.12), inset 0 1px 0 #fff; }

  .chip { background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.75); }
  .chip:hover { background: rgba(204,251,241,.75); border-color: #5eead4; }
  .pill { border-radius: 999px; padding: 2px 10px; font-size: 11px; border: 1px solid rgba(255,255,255,.7); }

  .fade-in { animation: fade .55s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .blur-name { filter: blur(7px); user-select: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #qrBox img, #qrBox canvas, #qrBig img, #qrBig canvas { width: 100%; height: auto; image-rendering: pixelated; }
  #toast { transition: opacity .25s, transform .25s; }

  /* ===== 모둠 이름표 (A4 세로, 접이식) =====
     위 25% 여백 → 역할 칸(180° 회전) → Team name 칸 → 아래 여백.
     가운데 두 칸이 접었을 때 앞·뒷면이 됩니다. */
  .drop-on { box-shadow: 0 0 0 3px rgba(20,184,166,.55), var(--glass-shadow) !important; }
  .tag-sheet {
    position: relative; width: 100%; aspect-ratio: 210 / 297; overflow: hidden;
    background: #fff; color: #111; container-type: inline-size;
    font-family: 'Quicksand', 'Noto Sans KR', sans-serif; font-weight: 500;
    box-shadow: 0 6px 24px rgba(15,23,42,.12); border-radius: 6px;
  }
  .tag-band { position: absolute; left: 0; right: 0; border-top: .5cqw solid #111; }
  .tag-roles { top: 25%; height: 25.7%; }
  .tag-team { top: 50.7%; height: 25.4%; border-bottom: .5cqw solid #111; }
  .tag-flip {
    position: absolute; inset: 0; transform: rotate(180deg);
    display: grid; grid-template-columns: 1fr 1fr; align-content: center; row-gap: 11cqw; padding: 0 5cqw 0 8cqw;
  }
  .tag-role { display: flex; align-items: baseline; gap: 1.6cqw; font-size: 3.6cqw; white-space: nowrap; min-width: 0; }
  .tag-role b { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 5.2cqw; overflow: hidden; text-overflow: ellipsis; }
  .tag-label { position: absolute; left: 2.8cqw; top: 3cqw; font-size: 3.6cqw; }
  .tag-no { position: absolute; right: 3cqw; bottom: 2.5cqw; font-size: 2.2cqw; color: #b8b8b8; font-family: 'Noto Sans KR', sans-serif; }

  @media (prefers-reduced-motion: reduce) {
    .blobs span, .fade-in, .pulse { animation: none !important; }
    .glass-card { transition: none; }
  }
  /* backdrop-filter 미지원 브라우저: 불투명도를 높여 가독성 확보 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { --glass-tint: rgba(255,255,255,.88); --glass-tint-2: rgba(255,255,255,.78); }
  }

  /* ===== 인쇄 ===== */
  @page { size: A4; margin: 10mm; }
  @page tagpage { size: A4; margin: 0; }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff !important; }
    .blobs, .no-print { display: none !important; }
    main { padding: 0 !important; max-width: none !important; }
    .glass { background: #fff !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
    .contract { break-inside: avoid; animation: none !important; border-radius: 10px !important; }
    body.print-each #contracts { display: block !important; }
    body.print-each .contract { break-after: page; min-height: 255mm; margin: 0 !important; font-size: 15px; }
    body.print-each .contract:last-child { break-after: auto; }
    body.print-all #contracts { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 5mm !important; }
    body.print-all .contract { padding: 4mm 5mm !important; font-size: 10.5px; border-radius: 6px !important; }
    body.print-all .contract h3 { font-size: 14px !important; }
    body.print-all .contract header { padding-bottom: 2mm !important; margin-bottom: 2mm !important; }
    body.print-all .contract section { margin-bottom: 2mm !important; }
    body.print-all .sig { display: none !important; }
    /* 이름표: 모둠별 A4 한 장, 여백 0 */
    body.print-tags #tags { display: block !important; }
    body.print-tags .tag-card { display: block; padding: 0 !important; border: 0 !important; background: none !important; border-radius: 0 !important; }
    body.print-tags .tag-ui { display: none !important; }
    body.print-tags .tag-sheet { page: tagpage; width: 210mm; height: 296mm; aspect-ratio: auto; box-shadow: none; border-radius: 0; break-after: page; }
    body.print-tags .tag-card:last-child .tag-sheet { break-after: auto; }
  }
</style>

<script>
/* =========================================================
   상수
   ========================================================= */
const GROUPS = 6;
const KEY = 'coop-grouping-v2';
const STUDENT_KEY = 'coop-student-gc';            // 학생 태블릿: 학년·반 기억(공용 태블릿 편의)
// 교사 PC ↔ 태블릿 중계 서버(ntfy, HTTPS 443). 자체 ntfy 서버가 있으면 주소만 바꾸면 됩니다.
const RELAY = 'https://ntfy.sh';
const CODE_LEN = 8;
const PROMISE = '우리는 서로 틀리는 것을 비웃지 않고, 끝까지 질문하며 함께 배웁니다.';
const EXAMPLES = [
  '발음이 어려운 친구를 끝까지 기다려 주기',
  '활동 규칙을 친절하게 다시 설명해 주기',
  '모두가 한 마디씩 말하도록 순서를 챙기기',
  '모르는 단어를 함께 찾아보고 알려 주기',
  '틀려도 괜찮다고 먼저 말해 주기',
  '말하기 연습 상대가 되어 주기'
];
const ROLES = [                                    // 이름표 역할 칸(Buddy는 버디로 고정)
  { key: 'rep', label: 'Representer', ko: '대표' },
  { key: 'rec', label: 'Recorder', ko: '기록' },
  { key: 'mgr', label: 'Team manager', ko: '관리' }
];
// 제출 결과 코드 → 안내 문구 (교사·학생 공통)
const ERR = {
  closed: '지금은 접수 시간이 아닙니다. 선생님 안내를 기다려 주세요.',
  bad: '학년, 반, 번호, 이름을 모두 정확히 입력하세요.',
  buddy: '버디는 지원할 수 없습니다.',
  dup: '이미 제출한 학생입니다. 바꾸고 싶으면 선생님께 말씀하세요.',
  full: '이 약속은 마감되었습니다. 다른 약속을 골라 주세요.',
  sex: '성별(남학생/여학생)을 선택하세요.',
  sexfull: '이 약속은 같은 성별 자리가 모두 찼습니다. 다른 약속을 골라 주세요.',
  invalid: '잘못된 선택입니다.'
};

const SEX = { M: '남', F: '여' };
// 엑셀 내보내기 라이브러리(SheetJS): 버튼을 누를 때만 불러옴
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

const params = new URLSearchParams(location.search);
const IS_STUDENT = params.has('room') || params.has('join');

/* =========================================================
   공통 유틸
   ========================================================= */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
};
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translate(-50%, 0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, 12px)'; }, 2200);
}
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function makeCode(len = CODE_LEN) {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';           // 헷갈리는 0/O, 1/I 제외
  const r = crypto.getRandomValues(new Uint32Array(len));
  return Array.from(r, n => abc[n % abc.length]).join('');
}
const prettyCode = (c) => c.length === 8 ? c.slice(0, 4) + ' ' + c.slice(4) : c;
const cleanCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
// 다시 그릴 때 입력 중인 칸의 포커스·커서 위치 유지
function keepFocus(fn) {
  const a = document.activeElement, id = a && a.id;
  let sel = null;
  try { if (id && a.selectionStart != null) sel = [a.selectionStart, a.selectionEnd]; } catch (e) { /* number 입력 등 */ }
  fn();
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* 무시 */ }
}
// 학생 정보 검증: 원격 입력이므로 형식·범위를 엄격히 확인
function sanitizeStudent(s) {
  if (!s || typeof s !== 'object') return null;
  const int = (v, lo, hi) => { const n = Number(v); return Number.isInteger(n) && n >= lo && n <= hi ? n : null; };
  const grade = int(s.grade, 1, 6), cls = int(s.cls, 1, 30), no = int(s.no, 1, 60);
  const name = String(s.name ?? '').trim().slice(0, 12);
  const sex = SEX[s.sex] ? s.sex : null;
  return grade && cls && no && name && sex ? { grade, cls, no, name, sex } : null;
}

/* =========================================================
   중계(Relay): ntfy 토픽으로 메시지를 주고받음
   - 방 코드 → SHA-256 → 토픽 이름 / AES-GCM 키 (서버는 코드·내용을 알 수 없음)
   - 학생 → 교사: <토픽>-in,  교사 → 학생: <토픽>-out
   ========================================================= */
const te = new TextEncoder(), td = new TextDecoder();
const sha = async (s) => new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)));
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function roomChannel(code) {
  const t = await sha('egm-topic:' + code), k = await sha('egm-key:' + code);
  const hex = Array.from(t.slice(0, 12), b => b.toString(16).padStart(2, '0')).join('');
  const key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['encrypt', 'decrypt']);
  return { inTopic: `egm-${hex}-in`, outTopic: `egm-${hex}-out`, key };
}
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return b64(out);
}
async function unseal(key, str) {
  try {
    const raw = unb64(str);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(td.decode(pt));
  } catch (e) { return null; }                      // 다른 방·손상된 메시지는 무시
}
async function relayPublish(topic, key, obj) {
  const res = await fetch(`${RELAY}/${topic}`, { method: 'POST', body: await seal(key, obj) });
  if (!res.ok) { const err = new Error('relay ' + res.status); err.status = res.status; throw err; }
}
// SSE 구독. 끊기면 점점 간격을 늘려 다시 연결(요청 한도 보호)
function relaySubscribe(topic, key, since, onMsg, onStatus) {
  let es = null, closed = false, wait = 3000, timer = null, queue = Promise.resolve();
  const open = () => {
    es = new EventSource(`${RELAY}/${topic}/sse?since=${since}`);
    es.onopen = () => { wait = 3000; onStatus('open'); };
    es.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.event && m.event !== 'message') return;
      // 복호화는 비동기이므로 도착 순서를 지키도록 줄 세움
      queue = queue.then(() => unseal(key, m.message)).then(obj => { if (obj && !closed) onMsg(obj); });
    };
    es.onerror = () => {
      if (closed) return;
      onStatus('error');
      if (es.readyState === EventSource.CLOSED) {
        timer = setTimeout(() => { if (!closed) open(); }, wait);
        wait = Math.min(wait * 2, 60000);
      }
    };
  };
  open();
  return { close() { closed = true; clearTimeout(timer); if (es) es.close(); } };
}
const relayErrorText = (e) => e && e.status === 429
  ? '중계 서버 사용 한도에 도달했습니다. 잠시 후 자동으로 다시 시도합니다.'
  : '중계 서버에 접속하지 못했습니다. 인터넷 연결을 확인하세요.';

/* =========================================================
   모둠원 데이터
   - 교사 입력: { name, sex }
   - QR 제출:  { name, sex, grade, cls, no, via: 'qr' }
   ========================================================= */
const memberKey = (m) => m.grade ? `${m.grade}-${m.cls}-${m.no}` : 'n:' + m.name;
const memberLabel = (m) => m.grade ? `${m.grade}-${m.cls}-${m.no} ${m.name}` : m.name;

if (IS_STUDENT) bootStudent(); else bootTeacher();

/* #########################################################
   교사(메인) 화면
   ######################################################### */
function bootTeacher() {

/* ---------- 상태 관리 (localStorage 자동 저장) ---------- */
function freshState() {
  return {
    step: 1,
    shuffle: true,
    maxPer: 4,
    genderOn: true,                               // 성별 상한 사용
    capM: 2,                                      // 모둠별 남학생 상한
    capF: 2,                                      // 모둠별 여학생 상한
    mode: 'qr',                                   // 'qr' 학생 태블릿 | 'teacher' 교사 입력
    room: '',                                     // QR 방 코드
    qrOpen: true,                                 // 학생 제출 접수 여부
    publicUrl: '',                                // 파일로 열었을 때 학생용 공개 주소
    buddies: Array.from({ length: GROUPS }, () => ({ name: '', pledge: '', sex: '' })),
    roster: [],
    rosterSex: {},                                // 명단에 적은 성별 {이름: 'M'|'F'}
    rosterDraft: '',
    members: Array.from({ length: GROUPS }, () => []),
    roles: Array.from({ length: GROUPS }, () => ({ rep: '', rec: '', mgr: '' })),
    history: [],                                  // 되돌리기용 {g, key}
    feed: [],                                     // 최근 QR 제출 기록
    results: [],                                  // 학생에게 돌려줄 최근 제출 결과
    seen: [],                                     // 이미 처리한 제출 ID(중복 처리 방지)
    current: '',
    currentSex: '',
    teacherView: false,
    revealed: false,
    view3: 'groups'                               // 3단계 보기: 'groups' 모둠 구성 | 'tags' 이름표 | 'contract' 서약서
  };
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장 불가 환경 무시 */ }
}
let S = Object.assign(freshState(), load() || {});
if (S.room && S.room.length !== CODE_LEN) S.room = '';   // 이전 버전(P2P) 코드는 새로 발급
const UI = { qrBig: false };

const allMembers = () => S.members.flat();
const memberNames = () => allMembers().map(m => m.name);
const buddyNames = () => S.buddies.map(b => b.name.trim());
const unassigned = () => S.roster.filter(n => !memberNames().includes(n));
const isAccepting = () => S.mode === 'qr' && S.step === 2 && S.qrOpen;
// 성별 인원은 버디를 포함해 셈(버디도 모둠의 한 사람)
const buddySex = (g, sex) => (S.buddies[g] && S.buddies[g].sex === sex ? 1 : 0);
const countSex = (g, sex) => S.members[g].filter(m => m.sex === sex).length + buddySex(g, sex);
// 모둠별로 받을 수 있는 학생 수(버디 제외): 최대 인원과 성별 남은 자리 중 작은 값
const studentCap = (g) => S.genderOn
  ? Math.min(S.maxPer, Math.max(0, S.capM - buddySex(g, 'M')) + Math.max(0, S.capF - buddySex(g, 'F')))
  : S.maxPer;
const capOf = (sex) => sex === 'M' ? S.capM : S.capF;
const sexFull = (g, sex) => S.genderOn && countSex(g, sex) >= capOf(sex);
const groupFull = (g) => S.members[g].length >= S.maxPer || (S.genderOn && sexFull(g, 'M') && sexFull(g, 'F'));

// 교사 입력·QR 제출 공통 배치 로직. 실패 시 ERR 코드 반환
function addMember(g, m) {
  if (!m.name) return 'bad';
  if (!S.buddies[g]) return 'invalid';
  if (buddyNames().includes(m.name)) return 'buddy';
  const key = memberKey(m);
  if (allMembers().some(x => memberKey(x) === key)) return 'dup';
  if (!m.grade && memberNames().includes(m.name)) return 'dup';
  if (S.members[g].length >= S.maxPer) return 'full';
  if (S.genderOn && !SEX[m.sex]) return 'sex';
  if (sexFull(g, m.sex)) return 'sexfull';
  S.members[g].push(m);
  S.history.push({ g, key });
  return null;
}
function removeByKey(g, key) {
  const k = S.members[g].findIndex(m => memberKey(m) === key);
  return k < 0 ? null : S.members[g].splice(k, 1)[0];
}

/* ---------- 중계: 교사 PC가 제출을 받아 처리 ---------- */
const NET = { ch: null, sub: null, starting: false, status: 'off', msg: '', room: '',
  pubTimer: null, publishing: false, lastSent: '', holdUntil: 0 };

async function ensureHost() {
  if (S.mode !== 'qr' || S.step < 2) return;
  if (!S.room) { S.room = makeCode(); save(); }
  if (NET.starting || (NET.sub && NET.room === S.room)) return;
  destroyHost();
  NET.starting = true; NET.status = 'connecting'; NET.room = S.room;
  try {
    if (!window.crypto || !crypto.subtle) throw new Error('보안 연결(HTTPS)에서만 사용할 수 있습니다.');
    NET.ch = await roomChannel(S.room);
  } catch (e) {
    NET.starting = false; NET.status = 'error'; NET.msg = e.message; refreshNet(); return;
  }
  NET.starting = false;
  if (NET.room !== S.room) return ensureHost();
  // since=all: 교사 화면이 잠시 꺼져 있던 동안의 제출도 받아 처리(중복은 seen으로 걸러냄)
  NET.sub = relaySubscribe(NET.ch.inTopic, NET.ch.key, 'all', onStudentMsg, (st) => {
    if (st === 'open') { NET.status = 'ready'; NET.msg = ''; schedulePublish(true); }
    else { NET.status = 'error'; NET.msg = '중계 서버 연결이 끊겼습니다. 자동으로 다시 연결합니다.'; }
    refreshNet();
  });
  refreshNet();
}
function destroyHost() {
  if (NET.sub) NET.sub.close();
  clearTimeout(NET.pubTimer);
  Object.assign(NET, { ch: null, sub: null, status: 'off', msg: '', room: '', lastSent: '', holdUntil: 0 });
}
function baseState() {
  // 학생 태블릿에는 버디 이름 없이 약속·인원만 전달(제출 결과는 publishState에서 덧붙임)
  return {
    t: 'state', open: isAccepting(), maxPer: S.maxPer,
    gs: S.genderOn ? { M: S.capM, F: S.capF } : null,   // 성별 상한(끄면 null)
    cards: S.buddies.map((b, g) => ({ g, p: b.pledge, c: S.members[g].length, m: countSex(g, 'M'), f: countSex(g, 'F') }))
  };
}
const hasUnsent = () => S.results.some(r => !r.pub);
// 상태가 바뀌었을 때만, 짧게 모아서 전송(중계 서버 일일 한도 절약)
function schedulePublish(force) {
  if (!NET.ch || NET.status === 'off') return;
  if (force) NET.lastSent = '';
  clearTimeout(NET.pubTimer);
  NET.pubTimer = setTimeout(publishState, 1200);
}
async function publishState() {
  if (!NET.ch || NET.publishing) return;
  // 전송 실패 후 대기 시간 안에는 보내지 않음(한도 초과 시 서버를 두드리지 않도록)
  const wait = NET.holdUntil - Date.now();
  if (wait > 0) { clearTimeout(NET.pubTimer); NET.pubTimer = setTimeout(publishState, wait); return; }
  const base = baseState(), baseJson = JSON.stringify(base);
  const unsent = S.results.filter(r => !r.pub);
  if (baseJson === NET.lastSent && !unsent.length) return;
  // 결과는 아직 안 보낸 것을 모두 싣고, 이미 보낸 것(재접속 학생용)은 자리가 남는 만큼만 실음.
  // ntfy 메시지 한도(4,096바이트) 안에 들도록 암호화·base64 증가분을 고려해 2,800바이트로 제한
  let sent = S.results.filter(r => r.pub), take = unsent;
  const build = () => ({ ...base, r: [...sent, ...take].map(r => ({ i: r.i, ok: r.ok, c: r.c, g: r.g })) });
  const tooBig = (p) => te.encode(JSON.stringify(p)).length > 2800;
  let p = build();
  while (tooBig(p) && sent.length) { sent = sent.slice(1); p = build(); }
  while (tooBig(p) && take.length > 1) { take = take.slice(0, -1); p = build(); }   // 남은 결과는 다음 전송으로
  NET.publishing = true;
  try {
    await relayPublish(NET.ch.outTopic, NET.ch.key, p);
    NET.lastSent = baseJson;
    take.forEach(r => { r.pub = 1; });
    const pubs = S.results.filter(r => r.pub);
    if (pubs.length > 40) { const old = new Set(pubs.slice(0, pubs.length - 40)); S.results = S.results.filter(r => !old.has(r)); }
    save();
    if (NET.status === 'error') { NET.status = 'ready'; NET.msg = ''; refreshNet(); }
  } catch (e) {
    NET.status = 'error'; NET.msg = relayErrorText(e); refreshNet();
    NET.holdUntil = Date.now() + (e.status === 429 ? 30000 : 8000);
  } finally {
    NET.publishing = false;
  }
  if (JSON.stringify(baseState()) !== NET.lastSent || hasUnsent()) schedulePublish();
}

function onStudentMsg(d) {
  if (!d || d.t !== 'join' || typeof d.i !== 'string') return;
  if (S.seen.includes(d.i)) return;
  S.seen.push(d.i); S.seen = S.seen.slice(-500);
  const done = (code, g) => {
    S.results.push({ i: d.i, ok: code ? 0 : 1, c: code || '', g, pub: 0 });
  };
  const s = sanitizeStudent(d.s), g = Number(d.g);
  if (!isAccepting()) done('closed');
  else if (!s) done('bad');
  else if (!Number.isInteger(g) || g < 0 || g >= GROUPS) done('invalid');
  else {
    // 응답을 못 받고 다시 제출한 같은 학생·같은 약속은 성공으로 처리
    const same = S.members[g].some(m => memberKey(m) === memberKey(s));
    const code = same ? null : addMember(g, { ...s, via: 'qr' });
    done(code, g);
    if (!code && !same) {
      S.feed.unshift({ label: memberLabel(s), g });
      S.feed = S.feed.slice(0, 8);
      toast('학생 1명이 약속을 골랐습니다.');   // 화면 공유 중일 수 있어 이름은 띄우지 않음
    }
  }
  render();
  schedulePublish();
}

function joinUrl() {
  let base = S.publicUrl.trim();
  if (base) base = base.split('#')[0].split('?')[0];
  else if (location.protocol.startsWith('http')) base = location.origin + location.pathname;
  return base && S.room ? `${base}?room=${S.room}` : '';
}
function netStatusHTML() {
  const qrCount = allMembers().filter(m => m.via === 'qr').length;
  const map = {
    off: ['bg-slate-400', '연결 꺼짐'],
    connecting: ['bg-amber-400 pulse', '중계 서버에 연결 중…'],
    ready: ['bg-emerald-500', `접수 준비 완료 · 태블릿 제출 ${qrCount}명`],
    error: ['bg-rose-500', NET.msg || '연결 오류']
  };
  const [cls, label] = map[NET.status] || map.off;
  return `<span class="dot ${cls} mt-1"></span><span class="flex-1">${esc(label)}</span>
    ${NET.status === 'error' ? `<button data-act="retryNet" class="btn btn-glass text-xs px-3 py-1">다시 연결</button>` : ''}`;
}
function refreshNet() {
  const el = $('#netStatus');
  if (el) el.innerHTML = netStatusHTML();
}
function drawQR() {
  const url = joinUrl();
  [['#qrBox', 220], ['#qrBig', 520]].forEach(([sel, size]) => {
    const el = $(sel);
    if (!el) return;
    el.innerHTML = '';
    if (!url) return;
    if (!window.QRCode) { el.innerHTML = '<p class="text-xs text-rose-700 p-4">QR 라이브러리를 불러오지 못했습니다.</p>'; return; }
    new QRCode(el, { text: url, width: size, height: size, colorDark: '#0f172a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  });
}

function sexBadge(g, sex) {
  const n = countSex(g, sex), cap = capOf(sex), full = n >= cap;
  return `<span class="${full ? 'text-rose-600 font-semibold' : ''}">${SEX[sex]} ${n}/${cap}${full ? ' 마감' : ''}</span>`;
}

/* ---------- 3단계: 모둠 공개 · 이름표 · 협동 서약서 ---------- */
function roleName(g, role) {
  const key = S.roles[g] && S.roles[g][role];
  const m = key && S.members[g].find(x => memberKey(x) === key);
  return m ? m.name : '';
}
function tagSheetHTML(g) {
  const b = S.buddies[g];
  const cell = (label, name) => `<div class="tag-role"><span>${label} :</span><b>${esc(name)}</b></div>`;
  return `
    <div class="tag-sheet">
      <div class="tag-band tag-roles">
        <div class="tag-flip">
          ${cell('Buddy', b.name)}${cell('Representer', roleName(g, 'rep'))}
          ${cell('Recorder', roleName(g, 'rec'))}${cell('Team manager', roleName(g, 'mgr'))}
        </div>
      </div>
      <div class="tag-band tag-team"><span class="tag-label">Team name</span></div>
      <span class="tag-no">모둠 ${g + 1}</span>
    </div>`;
}
function memberRowHTML(g, m) {
  const key = esc(memberKey(m));
  return `
    <li draggable="true" data-drag="${key}" data-g="${g}" class="flex items-center gap-2 rounded-xl bg-white/55 border border-white/80 px-3 py-2 text-sm cursor-grab active:cursor-grabbing">
      <span class="text-slate-400 select-none" aria-hidden="true">⠿</span>
      <span class="font-semibold truncate">${esc(m.name)}</span>
      <span class="text-xs text-slate-500 whitespace-nowrap">${m.sex ? SEX[m.sex] : '성별 없음'}${m.grade ? ` · ${m.grade}-${m.cls}-${m.no}` : ''}</span>
      <select data-move="${key}" data-g="${g}" class="input-glass ml-auto text-xs px-2 py-1" aria-label="${esc(m.name)} 모둠 이동">
        <option value="">이동…</option>
        ${S.buddies.map((_, k) => k === g ? '' : `<option value="${k}">모둠 ${k + 1}로</option>`).join('')}
      </select>
    </li>`;
}
function groupCardHTML(g) {
  const b = S.buddies[g], n = S.members[g].length;
  const warn = (bad) => bad ? 'text-rose-600 font-semibold' : '';
  const sexInfo = S.genderOn
    ? ['M', 'F'].map(x => `<span class="${warn(countSex(g, x) > capOf(x))}">${SEX[x]} ${countSex(g, x)}/${capOf(x)}</span>`).join(' · ')
    : '';
  return `
  <div class="glass glass-strong p-4" data-drop="${g}">
    <div class="flex items-center justify-between gap-2">
      <span class="text-sm font-semibold text-teal-800">모둠 ${g + 1}</span>
      <span class="text-xs text-slate-500"><span class="${warn(n > S.maxPer)}">모둠원 ${n}/${S.maxPer}</span>${sexInfo ? ' · ' + sexInfo : ''}</span>
    </div>
    <p class="mt-2 text-sm"><span class="text-xs text-slate-500">버디</span> <b>${esc(b.name)}</b> <span class="text-xs text-slate-500">${SEX[b.sex] || ''}</span></p>
    <p class="font-serif text-xs text-slate-600 mt-1">“${esc(b.pledge)}”</p>
    <ul class="mt-3 space-y-1.5">
      ${S.members[g].map(m => memberRowHTML(g, m)).join('') || '<li class="text-xs text-slate-400 py-4 text-center border border-dashed border-slate-300 rounded-xl">학생을 여기로 끌어다 놓으세요</li>'}
    </ul>
  </div>`;
}
// 학생을 다른 모둠으로 옮김(교사 판단 우선: 상한을 넘어도 옮기되 경고)
function moveMember(from, key, to) {
  if (from === to || !S.members[to]) return;
  const m = removeByKey(from, key);
  if (!m) return;
  S.members[to].push(m);
  ROLES.forEach(r => { if (S.roles[from][r.key] === key) S.roles[from][r.key] = ''; });
  S.history = S.history.filter(h => h.key !== key);
  const over = S.members[to].length > S.maxPer || (S.genderOn && m.sex && countSex(to, m.sex) > capOf(m.sex));
  render();
  toast(over ? `${m.name} → 모둠 ${to + 1} (인원 상한을 넘었습니다)` : `${m.name} 학생을 모둠 ${to + 1}로 옮겼습니다.`);
}

function tagCardHTML(g) {
  const mem = S.members[g];
  const others = mem.filter(m => !ROLES.some(r => S.roles[g][r.key] === memberKey(m)));
  return `
  <div class="tag-card glass glass-strong p-4">

      <span class="text-sm font-semibold text-teal-800">모둠 ${g + 1}</span>
      <span class="text-xs text-slate-500">버디 <b class="text-slate-800">${esc(S.buddies[g].name)}</b> · 모둠원 ${mem.length}명</span>
    </div>

      ${ROLES.map(r => `

          <select data-role="${r.key}" data-g="${g}" class="input-glass flex-1 px-2 py-1.5 text-sm">
            <option value="">(비워 두기 · 손으로 쓰기)</option>
            ${mem.map(m => `<option value="${esc(memberKey(m))}" ${S.roles[g][r.key] === memberKey(m) ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
          </select>
        </label>`).join('')}
      ${others.length ? `<p class="text-[11px] text-slate-500 pt-1">역할 없는 모둠원: ${others.map(m => esc(m.name)).join(', ')}</p>` : ''}

}
function contractHTML(g, idx) {

    </section>

    <section class="mb-4 rounded-2xl bg-white/45 border border-white/80 px-4 py-3 text-center">

      <p class="font-serif text-[15px] leading-relaxed">${PROMISE}</p>
    </section>

    <section class="sig mb-4">
      <p class="text-xs text-slate-500 mb-2">서명</p>
      <div class="grid grid-cols-2 gap-x-4 gap-y-3">
        ${[show ? b.name : '버디', ...mem.map(m => m.name)].map(n => `
          <div class="flex items-end gap-2 text-sm"><span class="w-16 truncate text-slate-700">${esc(n)}</span><span class="flex-1 border-b border-slate-400 h-5"></span></div>`).join('')}

    </footer>
  </article>`;
}
function renderStep3() {
  if (!S.revealed) {
    return `<section>
      <div class="no-print glass glass-strong p-10 text-center mb-6 fade-in">
        <p class="text-sm text-slate-500">모든 친구가 함께할 약속을 골랐습니다.</p>
        <p class="font-serif text-xl sm:text-2xl mt-2">이제 우리를 도와줄 버디가 누구인지 확인해 볼까요?</p>

      </div></section>`;
  }
  const v = ['groups', 'tags', 'contract'].includes(S.view3) ? S.view3 : 'groups';
  const tags = v === 'tags';
  const top = `
    <div class="no-print glass p-5 mb-5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="seg">
          <button data-act="view3" data-v="groups" class="${v === 'groups' ? 'on' : ''}">👥 모둠 구성</button>
          <button data-act="view3" data-v="tags" class="${tags ? 'on' : ''}">🏷️ 모둠 이름표</button>
          <button data-act="view3" data-v="contract" class="${v === 'contract' ? 'on' : ''}">📜 협동 서약서</button>
        </div>
        <div class="flex flex-wrap gap-2">
          ${v === 'groups' ? '' : tags ? `
            <button data-act="rolesRandom" class="btn btn-glass text-sm px-4 py-2">🎲 역할 무작위 배정</button>
            <button data-act="rolesClear" class="btn btn-glass text-sm px-4 py-2">역할 비우기</button>
            <button data-act="printTags" class="btn btn-primary text-sm px-4 py-2">인쇄: 모둠별 A4 이름표</button>`
          : `
            <button data-act="printAll" class="btn btn-primary text-sm px-4 py-2">인쇄: A4 한 장(전체)</button>
            <button data-act="printEach" class="btn btn-dark text-sm px-4 py-2">인쇄: 모둠별 한 장</button>
            <button data-act="copyAll" class="btn btn-glass text-sm px-4 py-2">전체 텍스트 복사</button>`}
          <button data-act="exportXlsx" class="btn btn-dark text-sm px-4 py-2">📥 엑셀로 내려받기</button>
          <button data-act="backTo2" class="btn text-sm px-4 py-2 text-slate-500 hover:bg-white/40">← 배치 수정</button>
        </div>
      </div>
      ${v === 'groups' ? `<p class="text-xs text-slate-500 mt-3">학생을 <b>끌어다 다른 모둠에 놓거나</b>, 이름 옆 <b>[이동…]</b>에서 모둠을 고르면 옮겨집니다(태블릿·터치 화면은 [이동…] 사용). 인원·성별 상한을 넘으면 빨간색으로 표시됩니다.</p>` : ''}
      ${tags ? `<p class="text-xs text-slate-500 mt-3">역할 칸은 접었을 때 반대쪽에서 읽히도록 거꾸로 인쇄됩니다. 역할을 비워 두면 학생이 직접 쓰고, <b>Team name</b>은 모둠이 함께 정해 손으로 씁니다.</p>` : ''}
    </div>`;
  return `<section>${top}
    ${v === 'groups'
      ? `<div id="groups" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">${S.buddies.map((_, g) => groupCardHTML(g)).join('')}</div>`
      : tags
      ? `<div id="tags" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">${S.buddies.map((_, g) => tagCardHTML(g)).join('')}</div>`
      : `<div id="contracts" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">${S.buddies.map((_, g) => contractHTML(g, g)).join('')}</div>`}
  </section>`;
}

/* ---------- 텍스트 / 인쇄 / 복사 ---------- */
function contractText(g) {
  const b = S.buddies[g];
  const roles = ROLES.map(r => roleName(g, r.key) && `${r.label}: ${roleName(g, r.key)}`).filter(Boolean);
  return [
    `[영어 협동 서약서 - 모둠 ${g + 1}]`,
    `모둠 버디: ${b.name}`,
    `도움 서약: ${b.pledge}`,
    `모둠원: ${S.members[g].map(memberLabel).join(', ') || '(없음)'}`,
    ...(roles.length ? [`역할: ${roles.join(', ')}`] : []),
    `공통 약속: ${PROMISE}`
  ].join('\n');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('복사되었습니다.'); return; }
  catch (e) { /* 아래 대체 방식 */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('복사되었습니다.'); } catch (e) { toast('복사에 실패했습니다.'); }
  ta.remove();
}
function doPrint(mode) {
  document.body.classList.add('print-' + mode);
  const clear = () => document.body.classList.remove('print-all', 'print-each', 'print-tags');
  window.addEventListener('afterprint', clear, { once: true });
  setTimeout(() => { window.print(); setTimeout(clear, 500); }, 50);
}

/* ---------- 엑셀 내보내기 ---------- */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = XLSX_SRC; sc.onload = () => ok(window.XLSX); sc.onerror = fail;
    document.head.appendChild(sc);
  });
}
async function exportXlsx() {
  let X;
  try { X = await loadXlsx(); } catch (e) { return toast('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); }
  const roleOf = (g, m) => (ROLES.find(r => S.roles[g][r.key] === memberKey(m)) || {}).label || '';
  // 시트 1: 한 줄에 한 명(정렬·필터용)
  const rows = [['모둠', '구분', '이름', '성별', '학년', '반', '번호', '역할', '버디 도움 서약']];
  S.buddies.forEach((b, g) => {
    rows.push([g + 1, '버디', b.name, SEX[b.sex] || '', '', '', '', 'Buddy', b.pledge]);
    S.members[g].forEach(m => rows.push([g + 1, '모둠원', m.name, SEX[m.sex] || '', m.grade || '', m.cls || '', m.no || '', roleOf(g, m), b.pledge]));
  });
  // 시트 2: 한 줄에 한 모둠(게시·확인용)
  const most = Math.max(1, ...S.members.map(m => m.length));
  const sum = [['모둠', '버디', '도움 서약', ...Array.from({ length: most }, (_, i) => `모둠원 ${i + 1}`), '남(버디 포함)', '여(버디 포함)', '인원(버디 제외)']];
  S.buddies.forEach((b, g) => {
    const mem = S.members[g].map(m => m.name);
    sum.push([g + 1, b.name, b.pledge, ...Array.from({ length: most }, (_, i) => mem[i] || ''), countSex(g, 'M'), countSex(g, 'F'), mem.length]);
  });
  const sheet = (aoa, widths) => { const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(w => ({ wch: w })); return ws; };
  const wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, sheet(rows, [6, 8, 12, 6, 6, 6, 6, 14, 40]), '모둠 편성');
  X.utils.book_append_sheet(wb, sheet(sum, [6, 12, 40, ...Array(most).fill(12), 5, 5, 14]), '모둠별 요약');
  const d = new Date(), pad = (n) => String(n).padStart(2, '0');
  const blob = new Blob([X.write(wb, { bookType: 'xlsx', type: 'array' })],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  // 일부 브라우저가 한글 파일명을 무시하므로 영문 파일명 사용
  a.download = `groups_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('엑셀 파일을 내려받았습니다.');
}

// 이 앱에서 내려받은 엑셀(“모둠 편성” 시트)을 읽어 모둠 구성을 복원
async function importXlsx(file) {
  let X;
  try { X = await loadXlsx(); } catch (e) { return toast('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); }
  let rows;
  try {
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    rows = X.utils.sheet_to_json(wb.Sheets['모둠 편성'] || wb.Sheets[wb.SheetNames[0]], { defval: '' });
  } catch (e) { return toast('엑셀 파일을 읽지 못했습니다.'); }
  const sexOf = (v) => ({ '남': 'M', '여': 'F', M: 'M', F: 'F' })[String(v).trim()] || '';
  const cell = (r, k, max) => String(r[k] ?? '').trim().slice(0, max);
  const buddies = Array.from({ length: GROUPS }, () => ({ name: '', pledge: '', sex: '' }));
  const members = Array.from({ length: GROUPS }, () => []);
  const roles = Array.from({ length: GROUPS }, () => ({ rep: '', rec: '', mgr: '' }));
  let skipped = 0;
  for (const r of rows) {
    const g = Number(r['모둠']) - 1, name = cell(r, '이름', 12), sex = sexOf(r['성별']);
    if (!Number.isInteger(g) || g < 0 || g >= GROUPS || !name) { skipped++; continue; }
    if (cell(r, '구분', 10) === '버디') { buddies[g] = { name, sex, pledge: cell(r, '버디 도움 서약', 60) }; continue; }
    const st = sanitizeStudent({ grade: r['학년'], cls: r['반'], no: r['번호'], name, sex });
    const m = st ? { ...st, via: 'qr' } : (sex ? { name, sex } : { name });
    if (members.flat().some(x => memberKey(x) === memberKey(m) || (!m.grade && x.name === name))) { skipped++; continue; }
    members[g].push(m);
    const role = ROLES.find(x => x.label === cell(r, '역할', 20));
    if (role && !roles[g][role.key]) roles[g][role.key] = memberKey(m);
  }
  const missing = buddies.map((b, g) => b.name ? '' : g + 1).filter(Boolean);
  if (missing.length) return toast(`버디 정보가 없는 모둠이 있습니다(모둠 ${missing.join(', ')}). 이 앱에서 내려받은 엑셀인지 확인하세요.`);
  if (new Set(buddies.map(b => b.name)).size !== GROUPS) return toast('엑셀의 버디 이름이 겹칩니다.');
  if ((allMembers().length || S.step > 1) && !confirm('지금 화면의 모둠 구성을 엑셀 내용으로 바꿀까요?')) return;
  Object.assign(S, {
    buddies, members, roles, history: [], feed: [],
    maxPer: Math.min(6, Math.max(S.maxPer, ...members.map(m => m.length))),
    step: 3, revealed: true, view3: 'groups'
  });
  render(); window.scrollTo(0, 0);
  toast(`엑셀에서 버디 6명, 학생 ${members.flat().length}명을 불러왔습니다.${skipped ? ` (${skipped}줄 건너뜀)` : ''}`);
}

/* ---------- 렌더 ---------- */
function render() {
  ensureHost();
  renderStepper();
  keepFocus(() => {
    $('#app').innerHTML = S.step === 1 ? renderStep1() : S.step === 2 ? renderStep2() : renderStep3();
  });
  drawQR();
  schedulePublish();
  save();
}

/* ---------- 이벤트: 입력 ---------- */
document.addEventListener('input', (e) => {
  const mv = e.target.closest('[data-move]');
  if (mv) { if (mv.value !== '') moveMember(+mv.dataset.g, mv.dataset.move, +mv.value); return; }
  const roleSel = e.target.closest('[data-role]');
  if (roleSel) {
    const g = +roleSel.dataset.g, role = roleSel.dataset.role, key = roleSel.value;
    // 한 학생은 한 역할만: 다른 칸에 같은 학생이 있으면 비움
    if (key) ROLES.forEach(r => { if (r.key !== role && S.roles[g][r.key] === key) S.roles[g][r.key] = ''; });
    S.roles[g][role] = key;
    render(); return;
  }
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  const key = el.dataset.bind;
  if (key === 'name' || key === 'pledge') {
    const i = +el.dataset.i;
    S.buddies[i][key] = el.value;
    const badge = $('#badge-' + i); if (badge) badge.innerHTML = badgeHTML(i);
  } else if (key === 'current') {
    S.current = el.value.trim();
    // 명단에서 고른 경우: 명단의 성별로 맞춤(표기가 없으면 비워서 다시 고르게 함)
    if (el.tagName === 'SELECT') { S.currentSex = S.rosterSex[S.current] || ''; render(); return; }
  }
  else if (key === 'rosterDraft') S.rosterDraft = el.value;
  else if (key === 'shuffle') S.shuffle = el.checked;
  else if (key === 'genderOn') { S.genderOn = el.checked; render(); return; }
  else if (key === 'capM' || key === 'capF') {
    const n = +el.value, sex = key === 'capM' ? 'M' : 'F';
    if (S.members.some((_, g) => countSex(g, sex) > n)) {
      toast(`이미 ${SEX[sex]}학생이 그보다 많이 배치된 모둠이 있습니다.`);
      el.value = S[key]; return;
    }
    S[key] = n; render(); return;
  }
  else if (key === 'publicUrl') { S.publicUrl = el.value; save(); return; }
  else if (key === 'maxPer') {
    const n = +el.value;
    if (S.members.some(m => m.length > n)) {
      toast('이미 그보다 많이 배치된 모둠이 있습니다.');
      el.value = S.maxPer; return;
    }
    S.maxPer = n; render(); return;
  }
  save();
});
// 공개 주소는 입력을 마쳤을 때 QR을 다시 그림
document.addEventListener('change', (e) => {
  if (e.target.id === 'publicUrl') render();
  if (e.target.id === 'xlsxFile' && e.target.files[0]) { importXlsx(e.target.files[0]); e.target.value = ''; }
});
// 모둠 구성: 끌어서 옮기기(마우스)
let dragging = null;
document.addEventListener('dragstart', (e) => {
  const li = e.target.closest && e.target.closest('[data-drag]');
  if (!li) return;
  dragging = { g: +li.dataset.g, key: li.dataset.drag };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragging.key);
});
document.addEventListener('dragover', (e) => {
  const box = dragging && e.target.closest('[data-drop]');
  if (!box) return;
  e.preventDefault();
  document.querySelectorAll('.drop-on').forEach(el => el !== box && el.classList.remove('drop-on'));
  box.classList.add('drop-on');
});
document.addEventListener('dragleave', (e) => {
  const box = e.target.closest && e.target.closest('[data-drop]');
  if (box && !box.contains(e.relatedTarget)) box.classList.remove('drop-on');
});
document.addEventListener('drop', (e) => {
  const box = dragging && e.target.closest('[data-drop]');
  if (!box) return;
  e.preventDefault();
  const d = dragging; dragging = null;
  moveMember(d.g, d.key, +box.dataset.drop);
});
document.addEventListener('dragend', () => { dragging = null; document.querySelectorAll('.drop-on').forEach(el => el.classList.remove('drop-on')); });

/* ---------- 이벤트: 클릭 ---------- */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.act, g = +btn.dataset.g;

  switch (act) {
    case 'reset':
      if (!confirm('모든 내용을 지우고 처음부터 시작할까요?')) return;
      destroyHost(); S = freshState(); render(); break;

    case 'buddySex':
      S.buddies[+btn.dataset.i].sex = btn.dataset.sex; render(); break;

    case 'example': {
      const i = +btn.dataset.i;
      S.buddies[i].pledge = EXAMPLES[+btn.dataset.k];
      $('#pledge-' + i).value = S.buddies[i].pledge;
      $('#badge-' + i).innerHTML = badgeHTML(i);
      save(); break;
    }

    case 'toStep2': {
      const names = buddyNames();
      if (S.buddies.some(b => !b.name.trim() || !b.pledge.trim())) return toast('6명 모두 이름과 도움 서약을 적어 주세요.');
      if (S.buddies.some(b => !SEX[b.sex])) return toast('버디 6명의 성별을 모두 선택해 주세요.');
      if (new Set(names).size !== names.length) return toast('버디 이름이 겹칩니다.');
      // 이미 배치된 학생이 없을 때만 무작위로 섞음(배치 후 섞으면 모둠이 꼬임)
      if (S.shuffle && allMembers().length === 0) shuffleArr(S.buddies);
      S.buddies.forEach(b => { b.name = b.name.trim(); b.pledge = b.pledge.trim(); });
      S.step = 2; render(); window.scrollTo(0, 0); break;
    }

    case 'toStep1':
      S.step = 1; render(); break;

    case 'mode':
      S.mode = btn.dataset.mode; render(); break;

    case 'curSex':
      S.currentSex = btn.dataset.sex; render(); break;

    case 'exportXlsx': exportXlsx(); break;

    case 'importXlsx': $('#xlsxFile').click(); break;

    case 'toggleOpen':
      S.qrOpen = !S.qrOpen; render(); toast(S.qrOpen ? '학생 제출 접수를 열었습니다.' : '학생 제출 접수를 마감했습니다.'); break;

    case 'newRoom':
      if (!confirm('방 코드를 새로 만들면 접속 중인 태블릿은 새 QR로 다시 접속해야 합니다. 계속할까요?')) return;
      destroyHost(); S.room = makeCode(); S.results = []; render(); break;

    case 'retryNet':
      destroyHost(); render(); break;

    case 'qrBig': UI.qrBig = true; render(); break;
    case 'qrClose': UI.qrBig = false; render(); break;

    case 'applyRoster': {
      // "김하늘 여", "이도윤/남", "박서연(여)" 형식의 성별 표기 인식
      const sexMap = {};
      const list = [...new Set(S.rosterDraft.split(/[\n,]/).map(raw => {
        const m = raw.trim().match(/^(.*?)[\s/(]*(남|여)\)?$/);
        const name = (m && m[1].trim()) || raw.trim();
        if (m && m[1].trim()) sexMap[name] = m[2] === '남' ? 'M' : 'F';
        return name;
      }).filter(Boolean))].filter(n => !buddyNames().includes(n));
      S.roster = list; S.rosterSex = sexMap; S.current = '';
      render(); toast(list.length ? `명단 ${list.length}명을 적용했습니다.` : '명단을 비웠습니다.'); break;
    }

    case 'join': {
      const name = (S.current || '').trim();
      if (!name) return toast('먼저 선택할 친구의 이름을 입력하세요.');
      if (S.genderOn && !S.currentSex) return toast(ERR.sex);
      const code = addMember(g, { name, sex: S.currentSex || undefined });
      if (code) return toast(code === 'dup' ? `${name} 학생은 이미 배치되었습니다.` : ERR[code]);
      S.current = ''; S.currentSex = '';
      render();
      toast(`${name} → 모둠 ${g + 1}의 약속에 함께합니다.`);
      if (S.members.every((_, k) => groupFull(k)) && (!S.roster.length || unassigned().length))
        setTimeout(() => toast('모든 모둠이 마감되었습니다. 필요하면 최대 인원을 늘려 주세요.'), 2300);
      break;
    }

    case 'undo': {
      const last = S.history.pop();
      if (!last) return;
      const m = removeByKey(last.g, last.key);
      if (m && !m.grade) S.current = m.name;
      render(); if (m) toast(`${m.name} 학생의 선택을 되돌렸습니다.`); break;
    }

    case 'remove': {
      const key = btn.dataset.key;
      removeByKey(g, key);
      S.history = S.history.filter(h => h.key !== key);
      render(); break;
    }

    case 'toggleTeacher':
      S.teacherView = !S.teacherView; render(); break;

    case 'toStep3': {
      if (allMembers().length === 0) return toast('아직 배치된 학생이 없습니다.');
      if (S.mode === 'teacher' && S.roster.length && unassigned().length &&
          !confirm(`아직 배치되지 않은 학생이 ${unassigned().length}명 있습니다. 그래도 진행할까요?`)) return;
      if (S.members.some(m => m.length === 0) &&
          !confirm('모둠원이 없는 모둠이 있습니다. 그래도 진행할까요?')) return;
      S.step = 3; S.revealed = false; UI.qrBig = false; render(); window.scrollTo(0, 0); break;
    }

    case 'reveal':
      S.revealed = true; render(); break;

    case 'backTo2':
      S.step = 2; render(); break;

    case 'view3':
      S.view3 = btn.dataset.v; render(); break;

    case 'rolesRandom':
      S.roles = S.members.map(mem => {
        const keys = shuffleArr(mem.map(memberKey));
        return { rep: keys[0] || '', rec: keys[1] || '', mgr: keys[2] || '' };
      });
      render(); toast('역할을 무작위로 배정했습니다.'); break;

    case 'rolesClear':
      S.roles = Array.from({ length: GROUPS }, () => ({ rep: '', rec: '', mgr: '' }));
      render(); break;

    case 'printTags': doPrint('tags'); break;
    case 'printAll': doPrint('all'); break;
    case 'printEach': doPrint('each'); break;
    case 'copyOne': copyText(contractText(g)); break;
    case 'copyAll': copyText(S.buddies.map((_, k) => contractText(k)).join('\n\n')); break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && UI.qrBig) { UI.qrBig = false; render(); } });

render();
}

/* #########################################################
   학생 태블릿 화면 (?room=코드)
   ######################################################### */
function bootStudent() {
  $('#stepper').remove();
  $('#headerActs').remove();
  $('#appTitle').textContent = '우리 모둠 약속 고르기';
  $('#appSub').textContent = '버디의 이름은 비밀! 약속만 보고 골라요.';

  const saved = (() => { try { return JSON.parse(sessionStorage.getItem(STUDENT_KEY)) || {}; } catch (e) { return {}; } })();
  const ST = {
    room: cleanCode(params.get('room')),
    ch: null, sub: null, status: 'connecting', data: null, noHostTimer: null,
    grade: saved.grade || '', cls: saved.cls || '', no: '', name: '', sex: '',
    sel: null, pending: null, pendingTimer: null, done: null, err: ''
  };

  const studentInfo = () => sanitizeStudent({ grade: ST.grade, cls: ST.cls, no: ST.no, name: ST.name, sex: ST.sex });
  // 카드가 지금 이 학생에게 열려 있는지(전체 인원 + 내 성별 자리)
  const cardOpen = (d, c) => c.c < d.maxPer && !(d.gs && ST.sex && (ST.sex === 'M' ? c.m : c.f) >= d.gs[ST.sex]);

  /* ---------- 연결: since=latest로 최신 약속 카드를 받고, 이후 변경·결과를 실시간 수신 ---------- */
  async function connect() {
    if (ST.sub) ST.sub.close();
    ST.status = 'connecting'; render();
    try {
      if (!window.crypto || !crypto.subtle) throw new Error();
      ST.ch = ST.ch || await roomChannel(ST.room);
    } catch (e) { ST.status = 'error'; render(); return; }
    ST.sub = relaySubscribe(ST.ch.outTopic, ST.ch.key, 'latest', onHostMsg, (st) => {
      ST.status = st === 'open' ? 'online' : 'lost';
      clearTimeout(ST.noHostTimer);
      // 연결됐는데 카드가 오지 않으면 방 코드가 틀렸거나 선생님 화면이 닫혀 있음
      if (st === 'open' && !ST.data) ST.noHostTimer = setTimeout(() => { if (!ST.data) { ST.status = 'nohost'; render(); } }, 6000);
      render();
    });
  }
  function disconnect() { if (ST.sub) ST.sub.close(); ST.sub = null; clearTimeout(ST.noHostTimer); }

  function onHostMsg(d) {
    if (!d || d.t !== 'state' || !Array.isArray(d.cards)) return;
    ST.data = d;
    if (ST.status === 'nohost') ST.status = 'online';
    const res = ST.pending && (d.r || []).find(x => ST.pending.ids.includes(x.i));
    if (res) {
      clearTimeout(ST.pendingTimer);
      const p = ST.pending; ST.pending = null;
      if (res.ok) {
        ST.done = { name: p.name, pledge: (d.cards[res.g] || {}).p || '' };
        ST.no = ''; ST.name = ''; ST.sex = ''; ST.sel = null; ST.err = '';
        disconnect();                                  // 연결 수 절약: 완료 화면에서는 연결을 닫음
      } else ST.err = ERR[res.c] || '제출하지 못했습니다.';
    } else {
      const c = ST.sel != null && d.cards[ST.sel];
      if (c && !cardOpen(d, c)) { ST.sel = null; ST.err = '고른 약속이 방금 마감되었습니다. 다른 약속을 골라 주세요.'; }
    }
    render();
  }
  async function submit() {
    const s = studentInfo();
    if (!s) { ST.err = ERR.bad; return render(); }
    if (ST.sel == null) { ST.err = '함께할 약속을 하나 골라 주세요.'; return render(); }
    const card = ST.data.cards[ST.sel];
    if (!confirm(`${s.grade}학년 ${s.cls}반 ${s.no}번 ${s.name} (${SEX[s.sex]})\n\n“${card.p}”\n\n이 약속으로 제출할까요? 제출한 뒤에는 바꿀 수 없어요.`)) return;
    try { sessionStorage.setItem(STUDENT_KEY, JSON.stringify({ grade: s.grade, cls: s.cls })); } catch (e) { }
    // 응답이 늦어 다시 제출하는 경우 이전 ID의 결과도 계속 기다림
    const id = makeCode(10);
    const prev = ST.pending && ST.pending.stale ? ST.pending.ids : [];
    ST.pending = { ids: [...prev, id], name: s.name, stale: false }; ST.err = '';
    clearTimeout(ST.pendingTimer);
    render();
    try {
      await relayPublish(ST.ch.inTopic, ST.ch.key, { t: 'join', i: id, g: ST.sel, s });
    } catch (e) {
      ST.err = relayErrorText(e);
      if (prev.length) ST.pending.stale = true; else ST.pending = null;
      return render();
    }
    // 응답이 늦으면 다시 제출할 수 있게 함(같은 학생·같은 약속은 교사 PC에서 한 번만 반영)
    ST.pendingTimer = setTimeout(() => {
      if (!ST.pending) return;
      ST.pending.stale = true; ST.err = '응답이 늦어지고 있습니다. [다시 제출]을 눌러 주세요.'; render();
    }, 15000);
  }

  /* ---------- 화면 ---------- */
  function statusBar() {
    const map = {
      connecting: ['bg-amber-400 pulse', '선생님 화면에 연결 중…'],
      online: ['bg-emerald-500', ST.data ? (ST.data.open ? '연결됨 · 접수 중' : '연결됨 · 접수 대기') : '연결됨 · 약속 카드 불러오는 중…'],
      lost: ['bg-rose-500 pulse', '연결이 끊겼습니다. 다시 연결 중…'],
      nohost: ['bg-rose-500', '선생님 화면을 찾을 수 없습니다. 방 코드를 확인하거나 선생님께 알려 주세요.'],
      error: ['bg-rose-500', '이 기기에서는 연결할 수 없습니다. 브라우저를 최신으로 업데이트해 주세요.']
    };
    const [cls, label] = map[ST.status] || map.connecting;
    return `<div class="glass px-4 py-2.5 mb-4 flex items-center gap-2 text-sm text-slate-700">
      <span class="dot ${cls}"></span><span>${label}</span>
      <span class="ml-auto font-mono text-xs text-slate-500 whitespace-nowrap">방 ${esc(prettyCode(ST.room))}</span>
      ${['nohost', 'lost'].includes(ST.status) ? `<button data-sact="retry" class="btn btn-glass text-xs px-3 py-1 whitespace-nowrap">다시 연결</button>` : ''}
    </div>`;
  }
  function codeEntry() {
    return `<section class="fade-in max-w-md mx-auto">
      <div class="glass glass-strong p-8 text-center">
        <p class="font-serif text-xl font-bold">방 코드를 입력하세요</p>
        <p class="text-sm text-slate-500 mt-1">선생님 화면에 보이는 8자리 코드</p>
        <input id="codeInput" maxlength="9" autocomplete="off" autocapitalize="characters"
          class="input-glass mt-5 w-full text-center font-mono text-3xl tracking-[0.2em] uppercase py-3" placeholder="ABCD 1234">
        <button data-sact="enter" class="btn btn-primary w-full mt-4 py-3 text-base">입장하기</button>
      </div></section>`;
  }
  function doneView() {
    return `<section class="fade-in max-w-lg mx-auto">
      <div class="glass glass-strong p-8 text-center">
        <div class="mx-auto w-16 h-16 rounded-full grid place-items-center text-3xl text-white" style="background:linear-gradient(180deg,#2dd4bf,#0f766e);box-shadow:0 10px 30px rgba(15,118,110,.4)">✓</div>
        <p class="font-serif text-2xl font-bold mt-4">제출 완료!</p>
        <p class="text-sm text-slate-600 mt-2"><b>${esc(ST.done.name)}</b> 학생은 이 약속을 골랐어요.</p>
        <p class="font-serif text-lg leading-relaxed mt-4 rounded-2xl bg-white/50 border border-white/80 px-4 py-3">“${esc(ST.done.pledge)}”</p>
        <p class="text-xs text-slate-500 mt-4">나를 도와줄 버디는 모둠 공개 시간에 확인할 수 있어요.</p>
        <button data-sact="next" class="btn btn-primary w-full mt-6 py-3 text-base">다음 친구 입력하기</button>
      </div></section>`;
  }
  function mainView() {
    const d = ST.data;
    if (!d) return `<div class="glass p-10 text-center text-slate-500">${ST.status === 'nohost' ? 'QR을 다시 찍거나, 선생님 화면이 2단계(블라인드 가치 선택)에 있는지 확인해 주세요.' : '약속 카드를 불러오는 중…'}</div>`;
    const open = d.open;
    const num = (id, key, ph, max) => `<input id="${id}" data-sbind="${key}" value="${esc(ST[key])}" type="number" inputmode="numeric" min="1" max="${max}" placeholder="${ph}"
        class="input-glass w-full px-3 py-3 text-lg text-center font-semibold">`;
    return `
    <section class="fade-in pb-28">
      ${!open ? `<div class="glass mb-4 px-5 py-3 text-sm text-amber-900" style="--glass-tint:rgba(254,243,199,.6)">${ERR.closed}</div>` : ''}
      <div class="glass p-5 mb-5">
        <p class="text-sm font-semibold mb-3">① 내 정보</p>
        <div class="grid grid-cols-3 gap-3">
          <label class="text-xs text-slate-500">학년
            <select id="sGrade" data-sbind="grade" class="input-glass w-full mt-1 px-3 py-3 text-lg text-center font-semibold">
              <option value="">-</option>${[1, 2, 3, 4, 5, 6].map(n => `<option value="${n}" ${String(ST.grade) === String(n) ? 'selected' : ''}>${n}</option>`).join('')}
            </select></label>
          <label class="text-xs text-slate-500">반<div class="mt-1">${num('sCls', 'cls', '반', 30)}</div></label>
          <label class="text-xs text-slate-500">번호<div class="mt-1">${num('sNo', 'no', '번호', 60)}</div></label>
        </div>
        <div class="grid grid-cols-[1fr_auto] gap-3 mt-3 items-end">
          <label class="block text-xs text-slate-500">이름
            <input id="sName" data-sbind="name" value="${esc(ST.name)}" maxlength="12" placeholder="이름" autocomplete="off"
              class="input-glass w-full mt-1 px-4 py-3 text-lg font-semibold"></label>
          <div class="text-xs text-slate-500">성별
            <div class="seg mt-1 flex">
              ${Object.entries(SEX).map(([k, v]) => `<button data-sact="sex" data-sex="${k}" class="${ST.sex === k ? 'on' : ''} !px-5 !py-2.5 !text-base">${v}학생</button>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <p class="text-sm font-semibold mb-3 px-1">② 함께 실천하고 싶은 약속 고르기</p>
      <div class="grid sm:grid-cols-2 gap-4">
        ${d.cards.map(c => {
          const full = !cardOpen(d, c), picked = ST.sel === c.g;
          const left = d.gs ? (ST.sex ? `${SEX[ST.sex]}학생 자리 ${Math.max(0, d.gs[ST.sex] - (ST.sex === 'M' ? c.m : c.f))}` : `남 ${Math.max(0, d.gs.M - c.m)} · 여 ${Math.max(0, d.gs.F - c.f)} 남음`) : `남은 자리 ${d.maxPer - c.c}`;
          return `<button data-sact="pick" data-g="${c.g}" ${full || !open ? 'disabled' : ''}
            class="glass glass-card ${full ? 'glass-muted' : ''} ${picked ? 'picked' : ''} text-left p-5 min-h-[130px]">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold ${full ? 'text-slate-400' : 'text-teal-700'}">약속 ${c.g + 1}</span>
              <span class="pill ${full ? 'bg-slate-300/60 text-slate-700' : picked ? 'bg-teal-600 text-white' : 'bg-white/60 text-slate-600'}">${full ? '마감' : picked ? '✓ 선택함' : left}</span>
            </div>
            <p class="font-serif text-lg leading-relaxed mt-3 ${full ? 'text-slate-400' : 'text-slate-900'}">“${esc(c.p)}”</p>
          </button>`;
        }).join('')}
      </div>

      <div class="fixed bottom-0 inset-x-0 z-20 p-3" style="padding-bottom:max(12px, env(safe-area-inset-bottom))">
        <div id="sBar" class="glass glass-strong max-w-3xl mx-auto p-3 flex items-center gap-3">${barHTML()}</div>
      </div>
    </section>`;
  }
  function barHTML() {
    const d = ST.data;
    const waiting = ST.pending && !ST.pending.stale;
    const ready = !!studentInfo() && ST.sel != null && d && d.open && ST.status === 'online' && !waiting;
    const hint = !ST.sex ? '성별을 선택해 주세요.' : '정보를 입력하고 약속을 골라 주세요.';
    return `<p class="flex-1 text-sm ${ST.err && !waiting ? 'text-rose-700' : 'text-slate-600'} px-2">${esc(ST.err || (waiting ? '제출 중…' : ready ? '준비 완료! 제출하세요.' : hint))}</p>
      <button data-sact="submit" ${ready ? '' : 'disabled'} class="btn btn-primary px-6 py-3 text-base font-semibold">${waiting ? '제출 중…' : ST.pending ? '다시 제출' : '제출하기'}</button>`;
  }
  function render() {
    keepFocus(() => {
      $('#app').innerHTML = !ST.room ? codeEntry() : statusBar() + (ST.done ? doneView() : mainView());
    });
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-sbind]');
    if (!el) return;
    ST[el.dataset.sbind] = el.value;
    if (!ST.pending) ST.err = '';
    // 입력 중에는 전체를 다시 그리지 않고 하단 바만 갱신(커서 위치 유지)
    const bar = $('#sBar');
    if (bar) bar.innerHTML = barHTML();
  });
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-sact]');
    if (!btn || btn.disabled) return;
    const act = btn.dataset.sact;
    if (act === 'pick') { ST.sel = +btn.dataset.g; ST.err = ''; render(); }
    else if (act === 'sex') {
      ST.sex = btn.dataset.sex; ST.err = '';
      // 바꾼 성별 기준으로 고른 카드가 막히면 선택 해제
      const c = ST.data && ST.sel != null && ST.data.cards[ST.sel];
      if (c && !cardOpen(ST.data, c)) { ST.sel = null; ST.err = '고른 약속은 이 성별 자리가 찼습니다. 다른 약속을 골라 주세요.'; }
      render();
    }
    else if (act === 'submit') submit();
    else if (act === 'next') { ST.done = null; ST.data = null; connect(); window.scrollTo(0, 0); }
    else if (act === 'retry') connect();
    else if (act === 'enter') {
      const code = cleanCode($('#codeInput').value);
      if (code.length !== CODE_LEN) return toast('8자리 코드를 입력하세요.');
      location.search = '?room=' + code;
    }
  });

  if (ST.room) connect(); else render();
}
</script>
